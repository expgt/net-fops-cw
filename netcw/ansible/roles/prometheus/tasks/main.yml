---
- name: Install ca-certificates and curl
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Ensure keyrings directory exists with correct permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker official repository to Apt sources (DEB822 Format)
  ansible.builtin.shell: |
    cat <<EOF > /etc/apt/sources.list.d/docker.sources
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
  changed_when: true

- name: Force apt update after adding official repository
  ansible.builtin.apt:
    update_cache: true

- name: Install official Docker and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    state: present

- name: Ensure docker service is running and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create required configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/prometheus
    - /etc/alertmanager
    - /etc/telegraf
    - /etc/prometheus-stack

- name: Render stack configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'alert_rules.yml.j2', dest: '/etc/prometheus/alert_rules.yml' }
    - { src: 'prometheus.yml.j2', dest: '/etc/prometheus/prometheus.yml' }
    - { src: 'alertmanager.yml.j2', dest: '/etc/alertmanager/alertmanager.yml' }
    - { src: 'telegraf.conf.j2', dest: '/etc/telegraf/telegraf.conf' }
    - { src: 'docker-compose.yml.j2', dest: '/etc/prometheus-stack/docker-compose.yml' }
  notify: Restart Docker Compose services

- name: Ensure Docker Compose services are running
  community.docker.docker_compose_v2:
    project_src: /etc/prometheus-stack
    state: present
---
- name: Create node_exporter group
  ansible.builtin.group:
    name: node_exporter_user
    system: true
    state: present

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter_user
    system: true
    shell: /sbin/nologin
    group: node_exporter_user
    create_home: false

- name: Download and extract Node Exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_download_url }}"
    dest: "/tmp"
    remote_src: true

- name: Copy node_exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/node_exporter-1.11.0.linux-amd64/node_exporter"
    dest: "/usr/local/bin/node_exporter"
    owner: node_exporter_user
    group: node_exporter_user
    mode: '0755'
    remote_src: true

- name: Create systemd service file from template
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'

- name: Enable and start node_exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  notify: Restart node_exporter

- name: Create configuration directory
  ansible.builtin.file:
    path: /etc/nginx-log-exporter
    state: directory
    mode: '0755'

- name: Download and unarchive exporter binary
  ansible.builtin.unarchive:
    src: "{{ nginx_log_exporter_download_url }}"
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/prometheus-nginxlog-exporter

- name: Configure exporter namespaces (HCL format)
  ansible.builtin.template:
    src: config.hcl.j2
    dest: /etc/nginx-log-exporter/config.hcl
    mode: '0644'
  notify: Restart nginx-log-exporter

- name: Deploy systemd service file
  ansible.builtin.template:
    src: nginx-log-exporter.service.j2
    dest: /etc/systemd/system/nginx-log-exporter.service
    mode: '0644'

- name: Ensure service is started and enabled
  ansible.builtin.systemd:
    name: nginx-log-exporter
    state: started
    enabled: true
    daemon_reload: true
  notify: Restart nginx-log-exporter
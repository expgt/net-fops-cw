---
- name: Restart nginx-log-exporter
  ansible.builtin.systemd:
    name: nginx-log-exporter
    state: restarted
    daemon_reload: true
    enabled: true

- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true
    enabled: true
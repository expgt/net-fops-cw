node_exporter_version: "1.11.0"
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v1.11.0/node_exporter-1.11.0.linux-amd64.tar.gz"

nginx_log_exporter_version: "1.11.0"
nginx_log_exporter_download_url: "https://github.com/martin-helmich/prometheus-nginxlog-exporter/releases/download/v1.11.0/prometheus-nginxlog-exporter_1.11.0_linux_amd64.tar.gz"

nginx_log_exporter_listen_port: 4040
nginx_log_exporter_log_format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"'
nginx_log_exporter_log_path: "/var/log/nginx/access.log"